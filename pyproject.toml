[project]
name = "lexneedle"
version = "0.1.0"
description = "Deterministic Unicode-aware dictionary matching"
readme = "README.md"
authors = [
    { name = "crootman", email = "5169934+crootman@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = [".codex"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
branch = true
source = ["lexneedle"]
