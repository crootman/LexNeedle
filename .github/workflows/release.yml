name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Verify the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          version = tomllib.loads(text)["project"]["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version {version!r}")
          PY
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv build
      - name: Smoke test the wheel in isolation
        run: uv run --isolated --no-project --python 3.14 --with dist/*.whl tests/smoke_test.py
      - name: Smoke test the source distribution in isolation
        run: uv run --isolated --no-project --python 3.14 --with dist/*.tar.gz tests/smoke_test.py
      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          import email
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path("dist")
          wheel = next(dist.glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "lexneedle/py.typed" in names
              assert "lexneedle/matcher.py" in names
              metadata_name = next(name for name in names if name.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(metadata_name))
              assert metadata["Requires-Python"] == ">=3.14"
              assert metadata["License-Expression"] == "MIT"
              assert metadata["Description-Content-Type"] == "text/markdown"

          sdist = next(dist.glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              names = set(archive.getnames())
              assert any(name.endswith("src/lexneedle/py.typed") for name in names)
              assert any(name.endswith("README.md") for name in names)
          print(f"verified {wheel.name} and {sdist.name}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lexneedle
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always